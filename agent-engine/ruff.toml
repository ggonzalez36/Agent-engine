target-version = "py311"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "S",   # flake8-bandit (security audit)
]

ignore = [
    "S101", # allow assert in tests
]

[lint.per-file-ignores]
"tests/*" = ["S101"]
