[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-engine"
version = "0.1.0"
description = "Motor Multiagente Híbrido basado en LangGraph con Arquitectura Supervisor en Estrella"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.8.0",
    "redis>=5.0.8",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
